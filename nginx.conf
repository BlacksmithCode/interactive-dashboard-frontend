server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html — никогда не кэшируем (SPA entry point)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Хешированные ассеты Vite (assets/index-abc123.js) — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Остальные маршруты — SPA fallback без кэша
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
