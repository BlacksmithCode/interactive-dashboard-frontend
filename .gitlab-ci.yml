stages:
  - lint
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

# 1. Проверка синтаксиса
lint:
  stage: lint
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint
    - npx tsc --noEmit
  only:
    - merge_requests
    - main
    - /^feature\/.*/
    - /^fix\/.*/
    - /^hotfix\/.*/
    - /^refactor\/.*/

# 2. Сборка 
build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main
    - merge_requests

# 3. Деплой через Docker (На сервере!)
deploy:
  stage: deploy
  image: alpine:latest  
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - scp -r . $DEPLOY_USER@$DEPLOY_SERVER_IP:/tmp/frontend-build
    - ssh "$DEPLOY_USER@$DEPLOY_SERVER_IP" "
        cd /tmp/frontend-build &&
        docker build -t frontend-app:latest . &&
        docker stop frontend-app || true &&
        docker rm frontend-app || true &&
        docker run -d --name frontend-app --restart unless-stopped -p 80:80 frontend-app:latest &&
        rm -rf /tmp/frontend-build
      "
  only:
    - main
  when: manual