stages:
  - lint
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

# 1. Проверка синтаксиса
lint:
  stage: lint
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint
    - npx tsc --noEmit
  only:
    - merge_requests
    - main
    - develop

# 2. Сборка 
build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main
    - develop
	
# 3. Деплой через Docker
deploy:
  stage: deploy
  needs: ["build"]   # <-- новая строка
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_SERVER >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "
        docker pull $DOCKER_IMAGE &&
        docker stop frontend-app || true &&
        docker rm frontend-app || true &&
        docker run -d --name frontend-app --restart unless-stopped -p 80:80 $DOCKER_IMAGE
      "
  only:
    - main
  when: manual