stages:
  - check
  - build
  - package
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

check:lint:
  stage: check
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint
    - npx tsc --noEmit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docker:
  stage: package
  image: docker:27
  script:
    - docker build --no-cache -t $DOCKER_IMAGE .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $DOCKER_IMAGE
    - docker save $DOCKER_IMAGE -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - ssh $DEPLOY_USER@$DEPLOY_SERVER_IP "mkdir -p /opt/inno/proxy /opt/inno/grafana/provisioning/datasources /opt/inno/grafana/provisioning/dashboards"
    - scp docker-compose.yml $DEPLOY_USER@$DEPLOY_SERVER_IP:/opt/inno/docker-compose.yml
    - scp blackbox.yml $DEPLOY_USER@$DEPLOY_SERVER_IP:/opt/inno/blackbox.yml
    - scp proxy/nginx.conf $DEPLOY_USER@$DEPLOY_SERVER_IP:/opt/inno/proxy/nginx.conf
    - scp prometheus.yml $DEPLOY_USER@$DEPLOY_SERVER_IP:/opt/inno/prometheus.yml
    - scp grafana/provisioning/datasources/prometheus.yml $DEPLOY_USER@$DEPLOY_SERVER_IP:/opt/inno/grafana/provisioning/datasources/prometheus.yml
    - scp grafana/provisioning/dashboards/*.yml $DEPLOY_USER@$DEPLOY_SERVER_IP:/opt/inno/grafana/provisioning/dashboards/
    - scp grafana/provisioning/dashboards/*.json $DEPLOY_USER@$DEPLOY_SERVER_IP:/opt/inno/grafana/provisioning/dashboards/
    - scp image.tar $DEPLOY_USER@$DEPLOY_SERVER_IP:/tmp/image.tar
    - ssh $DEPLOY_USER@$DEPLOY_SERVER_IP "
        docker load -i /tmp/image.tar &&
        docker tag $DOCKER_IMAGE ${TARGET_REGISTRY}/interactive-dashboard-frontend:latest &&
        docker login -u '$CI_REGISTRY_USER' -p '$CI_REGISTRY_PASSWORD' '$CI_REGISTRY' &&
        cd /opt/inno &&
        docker compose down frontend proxy prometheus grafana 2>/dev/null;
        docker compose up -d frontend proxy prometheus grafana
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"