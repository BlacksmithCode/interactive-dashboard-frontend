stages:
  - lint
  - build

variables:
  DEPLOY_PATH: /home/team_user/frontend

# 1. Проверка синтаксиса
lint:
  stage: lint
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint
    - npx tsc --noEmit
  only:
    - merge_requests
    - main
    - develop

# 2. Сборка 
build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main
    - develop