services:
  postgres:
    image: postgres:16-alpine
    container_name: inno-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: inno
      POSTGRES_USER: inno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inno"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: it-camp.innoca.local/rsreu-team/interactive-dashboard-backend:latest
    container_name: inno-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inno
      SPRING_DATASOURCE_USERNAME: inno
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      APP_JWT_EXPIRATION_MS: 86400000

  frontend:
    image: it-camp.innoca.local/rsreu-team/interactive-dashboard-frontend:latest
    container_name: inno-frontend
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: inno-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"  
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
      - /home/team_user/certs/succdash.cer:/etc/nginx/certs/succdash.crt:ro
      - /home/team_user/certs/succdash.key:/etc/ssl/private/succdash.key:ro

  # ==========================================
  # БЛОК МОНИТОРИНГА (Prometheus + Grafana)
  # ==========================================

  # Сбор метрик самого сервера (Linux)
  node_exporter:
    image: prom/node-exporter:latest
    container_name: inno-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # Проверка доступности сайта (Blackbox)
  blackbox_exporter:
    image: prom/blackbox-exporter:latest
    container_name: inno-blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"

  # Хранилище и сборщик метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: inno-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - node_exporter
      - blackbox_exporter

  # Визуализация (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: inno-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus_data:
  grafana_data: